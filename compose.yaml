name: lolinder

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lolinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lolinder
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lolinder -d lolinder]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # BullMQ requires noeviction: evicted keys silently lose queued jobs.
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports:
      - 127.0.0.1:6380:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
